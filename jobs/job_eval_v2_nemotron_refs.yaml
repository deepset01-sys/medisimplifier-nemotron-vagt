name: medisimplifier-v2-eval-nemotron-refs
description: "Regenerate v2 student predictions on test split and save per-sample predictions to bucket (for scoring vs Nemotron references)"
parent_id: ${NEBIUS_PROJECT_ID}

resources:
  platform: gpu-h100-sxm
  preset: 1gpu-16vcpu-200gb
  disk_size: 250Gi
  subnet_id: ${NEBIUS_SUBNET_ID}

docker:
  # train-v32: rebuilt from docker/Dockerfile.train at HEAD e894c4a — includes evaluate.py --save-predictions.
  image: cr.eu-north1.nebius.cloud/e00p4ryvm6npw9w9pz/medisimplifier:train-v32@sha256:2c95dfef0a298ce258f094fa5d5647b0d7c84e297850bff8b7daba5a719694dc
  command: python
  args:
    - "evaluate.py"
    - "--model"
    - "openbio"
    - "--adapter-path"
    - "/mnt/adapters/adapter"
    - "--split"
    - "test"
    - "--output-dir"
    - "/mnt/adapters/eval_v2_nemotron"
    - "--save-predictions"

env:
  HF_TOKEN: "${HF_TOKEN}"
  HF_HOME: "/tmp/hf_cache"
  PYTHONUNBUFFERED: "1"

volumes:
  - bucket: medisimplifier-adapters-v2
    mount: /mnt/adapters
    mode: rw

timeout: 5h
