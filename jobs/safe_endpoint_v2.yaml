# Reference manifest: the settings of the Safe Endpoint deploy in docs/REPRODUCIBILITY.md ("Deploy the endpoint").
# No tool reads this file; the endpoint is created with the `nebius ai endpoint create` command there. "v2" in the
# file name is the project generation, not the image version.
name: medisimplifier-safe-endpoint-v6
description: "Safe Simplification Endpoint (endpoint-v6) — vLLM + calibration-informed gate (Qwen+Nemotron decide, Llama advisory) + /v1/audit_panel (VAGT panel selection, v2 pool)"
parent_id: ${NEBIUS_PROJECT_ID}

resources:
  platform: gpu-h100-sxm
  preset: 1gpu-16vcpu-200gb
  disk_size: 250Gi
  subnet_id: ${NEBIUS_SUBNET_ID}

docker:
  image: chambul/medisimplifier@sha256:<B1-DIGEST>
  command: /start.sh
  container_port: 8000

env:
  NEBIUS_API_KEY: "${NEBIUS_API_KEY}"
  QWEN_JUDGE_MODEL: "${QWEN_JUDGE_MODEL}"
  LLAMA_JUDGE_MODEL: "${LLAMA_JUDGE_MODEL}"
