# audit_pool/candidates.yaml — the /v1/audit_panel candidate pool manifest.
#
# A model is scorable ONLY if it has a committed verdict file at
# audit_pool/verdicts/<slug>.json. "pending" models are roadmap entries and
# are NOT scorable until their 708-row verdicts are generated (Step 6).
benchmark: MedSimp-JudgeBench

pooled:            # committed verdict file exists -> scorable now (Steps 1-4)
  - slug: Llama-3.3-70B-Instruct
    model: meta-llama/Llama-3.3-70B-Instruct
    prompt_provenance: v1 v2/no-CoT safety run (safety_eval_v2.py)
  - slug: Qwen3-32B
    model: Qwen/Qwen3-32B
    prompt_provenance: v1 v2/no-CoT safety run (safety_eval_v2.py)
  - slug: NVIDIA-Nemotron-3-Nano-30B-A3B
    model: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B
    prompt_provenance: nemotron_judge_test.py JSON-CoT prompt (max_tokens=8000)
  - slug: gemma-3-27b-it
    model: google/gemma-3-27b-it
    prompt_provenance: nemotron_judge_test.py step-by-step JSON prompt (max_tokens=4000)
    diagnosis_delta_phi_v: 0.0017      # 708-row, vs Llama+Qwen incumbent (incumbent-check 0.0706 PASS)
  - slug: gpt-oss-120b
    model: openai/gpt-oss-120b
    prompt_provenance: nemotron_judge_test.py step-by-step JSON prompt (max_tokens=8000)
    diagnosis_delta_phi_v: 0.0719      # 708-row, ≈ Nemotron Nano (+0.071); dose −0.030 (over-flags); incumbent-check 0.0706 PASS
  - slug: nemotron-3-super-120b-a12b
    model: nvidia/nemotron-3-super-120b-a12b
    prompt_provenance: nemotron_judge_test.py step-by-step JSON prompt (max_tokens=16000)
    diagnosis_delta_phi_v: 0.0653      # 708-row, < Nano 30B (+0.071) at 4× size; dose −0.059 (over-flags); 3 ERR; incumbent-check 0.0706 PASS
  - slug: DeepSeek-V4-Flash-0731
    model: deepseek-ai/DeepSeek-V4-Flash-0731
    prompt_provenance: nemotron_judge_test.py step-by-step JSON prompt (max_tokens=16000)
    diagnosis_delta_phi_v: 0.0597      # 708-row, diverse family also breaks the blind spot; 12 residual ERR (~truncation) after resume cleared 43/55; incumbent-check 0.0706 PASS

pending:           # require Step-6 verdict generation before scorable
  - slug: Nemotron-3-Ultra-550b-a55b
    model: nvidia/Nemotron-3-Ultra-550b-a55b
    max_tokens: 16000
    status: smoke-validated, ready for 708
